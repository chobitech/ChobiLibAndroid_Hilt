name: Publish to GitHub Packages

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check module version
        id: check_versions
        run: |
          source .github/scripts/check-version.sh
          check_version "chobilib" "com.github.chobitech.chobilib"
          check_version "chobilib-admob" "com.github.chobitech.chobilib-admob"
          check_version "chobilib-room" "com.github.chobitech.chobilib-room"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      

      - name: Publish

        #run: ./gradlew publish
        run: |
          source .github/scripts/exec-publish.sh
          exec_publish "chobilib" "${{ steps.check_versions.outputs.chobilib_publish }}"
          exec_publish "chobilib-admob" "${{ steps.check_versions.outputs.chobilib-admob_publish }}"
          exec_publish "chobilib-room" "${{ steps.check_versions.outputs.chobilib-room_publish }}"

#          if [ "${{ steps.check_versions.outputs.chobilib_publish }}" = "true" ]; then
#            ./gradlew :chobilib:publish
#          else
#            echo "chobilib: SKIPPED"
#          fi
#
#          if [ "${{ steps.check_versions.outputs.admob_publish }}" = "true" ]; then
#            ./gradlew :admob:publish
#          else
#            echo "admob: SKIPPED"
#          fi
#
#          if [ "${{ steps.check_versions.outputs.room_publish }}" = "true" ]; then
#            ./gradlew :room:publish
#          else
#            echo "room: SKIPPED"
#          fi

        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
